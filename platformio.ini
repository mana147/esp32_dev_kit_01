; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev
extra_configs = platformio_override.ini ; cổng serial riêng từng máy (không commit)

[env]
monitor_speed = 115200

[env:esp32dev]
platform = espressif32@^6.3.1
framework = arduino
monitor_filters = esp32_exception_decoder
board = esp32dev                     ; Bo mạch: "ESP32 Dev Module"
upload_speed = 921600                ; Upload Speed
board_build.f_cpu = 240000000L       ; CPU Frequency 240MHz
board_build.f_flash = 80000000L      ; Flash Frequency 80MHz
board_build.flash_mode = qio         ; Flash Mode QIO
board_upload.flash_size = 4MB        ; Flash Size 4MB
board_build.partitions = default.csv ; Default 4MB with spiffs
test_ignore = test_wifi_utils        ; chạy bằng env native
build_flags =
	-Wall
	-Wextra
	-DCORE_DEBUG_LEVEL=0             ; 0=None ... 5=Verbose
	-DARDUINO_RUNNING_CORE=1         ; Arduino Runs On: Core 1
	-DARDUINO_EVENT_RUNNING_CORE=1   ; Events Run On: Core 1
	; -DBOARD_HAS_PSRAM              ; Bật PSRAM nếu board hỗ trợ

[env:esp32dev_debug]
extends = env:esp32dev
build_flags =
	-Wall
	-Wextra
	-DCORE_DEBUG_LEVEL=4
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1

[env:native]
platform = native
test_framework = unity
test_ignore = test_hw_*              ; cần phần cứng
build_flags = -std=c++17
